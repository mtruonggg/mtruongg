<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ultra VIP Countdown 2026</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:system-ui;
  background:#000;
  color:#fff;
  perspective:1200px;
}

/* ===== CANVAS BG ===== */
canvas{
  position:fixed;
  inset:0;
  z-index:-1;
}

/* ===== WRAP ===== */
.wrap{
  text-align:center;
  transition:transform .4s ease;
}

.wrap.zoom{
  animation:zoomPulse .6s infinite alternate;
}

@keyframes zoomPulse{
  from{transform:scale(1)}
  to{transform:scale(1.05)}
}

.wrap.shake{
  animation:shake .25s infinite;
}

@keyframes shake{
  0%{transform:translateX(0)}
  25%{transform:translateX(-4px)}
  50%{transform:translateX(4px)}
  75%{transform:translateX(-2px)}
  100%{transform:translateX(0)}
}

h1{
  margin-bottom:30px;
  letter-spacing:3px;
  color:#ffd700;
}

/* ===== CLOCK ===== */
.clock{
  display:flex;
  align-items:center;
  gap:18px;
}

/* ===== GLASS BOX ===== */
.flip-box{
  width:110px;
  height:100px;
  position:relative;
  transform-style:preserve-3d;
}

/* Glassmorphism */
.glass{
  width:100%;
  height:100%;
  border-radius:22px;
  backdrop-filter:blur(18px);
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.2);
  box-shadow:
    0 10px 40px rgba(0,0,0,0.6),
    inset 0 0 20px rgba(255,215,0,0.2);
  display:flex;
  justify-content:center;
  align-items:center;
  position:absolute;
  backface-visibility:hidden;
  font-size:52px;
  font-weight:800;
}

/* Gold text */
.gold{
  background:linear-gradient(180deg,#fff8dc,#ffd700,#b8860b);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 0 8px rgba(255,215,0,.6);
}

/* Flip animation */
.flip-box.flip{
  animation:flip3d .8s cubic-bezier(.22,1,.36,1);
}

@keyframes flip3d{
  0%{transform:rotateX(0deg)}
  100%{transform:rotateX(-180deg)}
}

/* Colon */
.colon{
  font-size:60px;
  color:#ffd700;
  animation:blink 1.2s infinite;
}

@keyframes blink{
  0%,50%,100%{opacity:1}
  25%,75%{opacity:.3}
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="wrap" id="wrap">
  <h1>COUNTDOWN 2026</h1>
  <div class="clock">
    <div class="flip-box" id="hBox">
      <div class="glass gold" id="hFront">00</div>
    </div>

    <div class="colon">:</div>

    <div class="flip-box" id="mBox">
      <div class="glass gold" id="mFront">00</div>
    </div>

    <div class="colon">:</div>

    <div class="flip-box" id="sBox">
      <div class="glass gold" id="sFront">00</div>
    </div>
  </div>
</div>

<script>
const TARGET = new Date(2026,1,17,0,0,0).getTime();
const wrap = document.getElementById("wrap");

function updateBox(boxId, frontId, value){
  const box = document.getElementById(boxId);
  const front = document.getElementById(frontId);

  if(front.textContent === value) return;

  box.classList.add("flip");

  setTimeout(()=>{
    front.textContent = value;
  },400);

  setTimeout(()=>{
    box.classList.remove("flip");
  },800);
}

function loop(){
  const now = Date.now();
  const remain = Math.max(0, Math.floor((TARGET-now)/1000));

  const h = Math.floor(remain%86400/3600);
  const m = Math.floor(remain%3600/60);
  const s = remain%60;

  updateBox("hBox","hFront",String(h).padStart(2,"0"));
  updateBox("mBox","mFront",String(m).padStart(2,"0"));
  updateBox("sBox","sFront",String(s).padStart(2,"0"));

  /* 10 GIÂY CUỐI */
  if(remain <= 10 && remain > 0){
    wrap.classList.add("zoom","shake");
  }else{
    wrap.classList.remove("zoom","shake");
  }

  requestAnimationFrame(loop);
}
loop();

/* ===== VIP CANVAS BACKGROUND ===== */
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
resize();
addEventListener("resize",resize);

let angle=0;

function draw(){
  const g=ctx.createRadialGradient(
    canvas.width/2,canvas.height/2,0,
    canvas.width/2,canvas.height/2,canvas.width
  );
  g.addColorStop(0,"#1a1a2e");
  g.addColorStop(1,"#000814");
  ctx.fillStyle=g;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle="rgba(255,215,0,0.08)";
  for(let i=0;i<20;i++){
    ctx.beginPath();
    ctx.arc(
      canvas.width/2 + Math.cos(angle+i)*300,
      canvas.height/2 + Math.sin(angle+i)*300,
      80,0,Math.PI*2
    );
    ctx.fill();
  }

  angle+=0.002;
  requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
