<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Countdown 2027</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:system-ui;
  background:#000;
  color:#fff;
}

canvas{position:fixed;inset:0;z-index:-1}

/* Fade */
.fade-out{animation:fadeOut 1s forwards}
@keyframes fadeOut{to{opacity:0;transform:scale(1.1)}}

/* Wrap */
.wrap{text-align:center;transition:.4s}
.wrap.final{animation:zoomPulse .5s infinite alternate}
@keyframes zoomPulse{from{transform:scale(1)}to{transform:scale(1.05)}}

/* Title */
.title{
  font-size:22px;
  letter-spacing:4px;
  margin-bottom:20px;
  font-weight:800;
  background:linear-gradient(180deg,#fff6c7,#ffd700,#b8860b);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* Clock */
.clock{
  display:flex;
  align-items:center;
  gap:10px;
  transition:.6s;
  justify-content:center;
}

/* Box nhỏ hơn */
.box{
  width:70px;
  height:60px;
  border-radius:14px;
  backdrop-filter:blur(12px);
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.15);
  box-shadow:0 4px 15px rgba(0,0,0,0.6);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:30px;
  font-weight:800;
  transition:.5s;
}

.box.exit{animation:boxExit .6s forwards}
@keyframes boxExit{
  0%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(0.6);filter:blur(6px)}
}

.gold{
  background:linear-gradient(180deg,#fff6c7,#ffd700,#b8860b);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.colon{
  font-size:26px;
  color:#ffd700;
  animation:blink 1.2s infinite;
}
@keyframes blink{
  0%,50%,100%{opacity:1}
  25%,75%{opacity:.3}
}

.only-seconds{
  transform:scale(2.2);
  font-size:70px;
}

.shake{animation:shake .3s infinite}
@keyframes shake{
  0%{transform:translateX(0)}
  25%{transform:translateX(-2px)}
  50%{transform:translateX(2px)}
  75%{transform:translateX(-1px)}
  100%{transform:translateX(0)}
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="wrap" id="wrap">
  <div class="title">COUNTDOWN 01.01.2027</div>

  <div class="clock" id="clock">
    <div class="box gold" id="d">00</div>
    <div class="colon">:</div>
    <div class="box gold" id="h">00</div>
    <div class="colon">:</div>
    <div class="box gold" id="m">00</div>
    <div class="colon">:</div>
    <div class="box gold" id="s">00</div>
  </div>
</div>

<script>
/* ===== GIỮ NGUYÊN CATBOX ===== */
const TICK = "https://files.catbox.moe/o0fdwn.mp3";

/* ===== TARGET 01/01/2027 00:00:00 GIỜ VN ===== */
const targetVN = Date.UTC(2026,11,31,17,0,0);

const REDIRECT_URL = "./fireworks.html";

const wrap=document.getElementById("wrap");
const dEl=document.getElementById("d");
const hEl=document.getElementById("h");
const mEl=document.getElementById("m");
const sEl=document.getElementById("s");

const tickAudio=new Audio(TICK);
tickAudio.volume=0.9;

let soundEnabled=false;
window.addEventListener("pointerdown",()=>{
  if(soundEnabled)return;
  soundEnabled=true;
  tickAudio.play().then(()=>tickAudio.pause()).catch(()=>{});
},{once:true});

function playTick(){
  if(!soundEnabled)return;
  tickAudio.currentTime=0;
  tickAudio.play().catch(()=>{});
}

let last=-1;
let redirected=false;

function loop(){
  const nowUTC=Date.now();
  const remain=Math.max(0,Math.floor((targetVN-nowUTC)/1000));

  if(remain!==last){
    last=remain;

    const days=Math.floor(remain/86400);
    const hours=Math.floor(remain%86400/3600);
    const minutes=Math.floor(remain%3600/60);
    const seconds=remain%60;

    dEl.textContent=String(days).padStart(2,"0");
    hEl.textContent=String(hours).padStart(2,"0");
    mEl.textContent=String(minutes).padStart(2,"0");
    sEl.textContent=String(seconds).padStart(2,"0");

    if(remain<=10&&remain>0){
      wrap.classList.add("final");
      sEl.classList.add("shake");
      playTick();
      setTimeout(playTick,200);
    }else{
      wrap.classList.remove("final");
      sEl.classList.remove("shake");
      playTick();
    }

    if(remain===0&&!redirected){
      redirected=true;
      document.body.classList.add("fade-out");
      setTimeout(()=>{
        window.location.href=REDIRECT_URL;
      },1000);
    }
  }

  requestAnimationFrame(loop);
}
loop();

/* Background */
const canvas=document.getElementById("bg");
const ctx=canvas.getContext("2d");

function resize(){
  canvas.width=innerWidth;
  canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

let angle=0;
function draw(){
  ctx.fillStyle="#050b1a";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle="rgba(255,215,0,0.08)";
  ctx.lineWidth=2;
  for(let i=0;i<6;i++){
    ctx.beginPath();
    ctx.arc(canvas.width/2,canvas.height/2,120+i*50,angle,angle+Math.PI*1.2);
    ctx.stroke();
  }
  angle+=0.002;
  requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
