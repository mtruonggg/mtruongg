<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIP Countdown 2026</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:system-ui;
  background:#000;
  color:#fff;
}

canvas{
  position:fixed;
  inset:0;
  z-index:-1;
}

/* Fade out */
.fade-out{
  animation:fadeOut 1s forwards;
}
@keyframes fadeOut{
  to{opacity:0;transform:scale(1.1)}
}

/* Wrap */
.wrap{
  text-align:center;
  transition:.4s;
}

.wrap.final{
  animation:zoomPulse .5s infinite alternate;
}

@keyframes zoomPulse{
  from{transform:scale(1)}
  to{transform:scale(1.05)}
}

/* TITLE */
.title{
  font-size:28px;
  letter-spacing:6px;
  margin-bottom:30px;
  font-weight:800;
  background:linear-gradient(180deg,#fff6c7,#ffd700,#b8860b);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:
    0 0 10px rgba(255,215,0,.8),
    0 0 25px rgba(255,215,0,.4);
}

/* Clock */
.clock{
  display:flex;
  align-items:center;
  gap:14px;
  transition:.6s;
}

/* Box */
.box{
  width:90px;
  height:80px;
  border-radius:18px;
  backdrop-filter:blur(12px);
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.15);
  box-shadow:
    0 6px 20px rgba(0,0,0,0.6),
    inset 0 0 15px rgba(255,215,0,0.2);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:42px;
  font-weight:800;
  transition:.5s;
}

/* Exit animation */
.box.exit{
  animation:boxExit .6s forwards;
}
@keyframes boxExit{
  0%{opacity:1;transform:scale(1);filter:blur(0)}
  100%{opacity:0;transform:scale(0.6);filter:blur(8px)}
}

/* Gold text */
.gold{
  background:linear-gradient(180deg,#fff6c7,#ffd700,#b8860b);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 0 8px rgba(255,215,0,.6);
}

/* Colon */
.colon{
  font-size:40px;
  color:#ffd700;
  animation:blink 1.2s infinite;
  transition:.4s;
}
@keyframes blink{
  0%,50%,100%{opacity:1}
  25%,75%{opacity:.3}
}

/* Center modes */
.center{
  justify-content:center !important;
}

.only-seconds{
  transform:scale(2.8);
  font-size:90px;
}

/* Shake 10s cuối */
.shake{
  animation:shake .3s infinite;
}
@keyframes shake{
  0%{transform:translateX(0)}
  25%{transform:translateX(-3px)}
  50%{transform:translateX(3px)}
  75%{transform:translateX(-2px)}
  100%{transform:translateX(0)}
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="wrap" id="wrap">
  <div class="title">COUNTDOWN 2026</div>

  <div class="clock" id="clock">
    <div class="box gold" id="h">00</div>
    <div class="colon" id="c1">:</div>
    <div class="box gold" id="m">00</div>
    <div class="colon" id="c2">:</div>
    <div class="box gold" id="s">00</div>
  </div>
</div>

<script>
/* CONFIG */
const TARGET = new Date(2027,0,1,0,0,0).getTime();
const TICK = "https://files.catbox.moe/o0fdwn.mp3";
const REDIRECT_URL = "./fireworks.html";

/* ELEMENT */
const wrap = document.getElementById("wrap");
const clock = document.getElementById("clock");
const hEl = document.getElementById("h");
const mEl = document.getElementById("m");
const sEl = document.getElementById("s");
const c1 = document.getElementById("c1");
const c2 = document.getElementById("c2");

/* AUDIO */
const tickAudio = new Audio(TICK);
tickAudio.volume = 0.9;

let soundEnabled=false;
window.addEventListener("pointerdown",()=>{
  if(soundEnabled) return;
  soundEnabled=true;
  tickAudio.play().then(()=>tickAudio.pause()).catch(()=>{});
},{once:true});

function playTick(){
  if(!soundEnabled) return;
  tickAudio.currentTime=0;
  tickAudio.play().catch(()=>{});
}

/* LOOP */
let last=-1;
let hourRemoved=false;
let minuteRemoved=false;
let redirected=false;

function loop(){
  const now=Date.now();
  const remain=Math.max(0,Math.floor((TARGET-now)/1000));

  if(remain!==last){
    last=remain;

    const h=Math.floor(remain%86400/3600);
    const m=Math.floor(remain%3600/60);
    const s=remain%60;

    hEl.textContent=String(h).padStart(2,"0");
    mEl.textContent=String(m).padStart(2,"0");
    sEl.textContent=String(s).padStart(2,"0");

    /* Hết giờ */
    if(h===0 && !hourRemoved){
      hourRemoved=true;
      hEl.classList.add("exit");
      setTimeout(()=>{
        hEl.style.display="none";
        c1.style.display="none";
        clock.classList.add("center");
      },600);
    }

    /* Hết phút */
    if(h===0 && m===0 && !minuteRemoved){
      minuteRemoved=true;
      mEl.classList.add("exit");
      setTimeout(()=>{
        mEl.style.display="none";
        c2.style.display="none";
        sEl.classList.add("only-seconds");
      },600);
    }

    /* 10s cuối */
    if(remain<=10 && remain>0){
      wrap.classList.add("final");
      sEl.classList.add("shake");
      playTick();
      setTimeout(playTick,200);
    }else{
      wrap.classList.remove("final");
      sEl.classList.remove("shake");
      playTick();
    }

    /* Hết toàn bộ */
    if(remain===0 && !redirected){
      redirected=true;
      tickAudio.pause();
      document.body.classList.add("fade-out");
      setTimeout(()=>{
        window.location.href=REDIRECT_URL;
      },1000);
    }
  }

  requestAnimationFrame(loop);
}
loop();

/* BACKGROUND */
const canvas=document.getElementById("bg");
const ctx=canvas.getContext("2d");

function resize(){
  canvas.width=innerWidth;
  canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

let angle=0;

function draw(){
  ctx.fillStyle="#050b1a";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.strokeStyle="rgba(255,215,0,0.08)";
  ctx.lineWidth=2;

  for(let i=0;i<6;i++){
    ctx.beginPath();
    ctx.arc(
      canvas.width/2,
      canvas.height/2,
      150+i*60,
      angle,
      angle+Math.PI*1.2
    );
    ctx.stroke();
  }

  angle+=0.002;
  requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
