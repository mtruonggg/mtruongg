<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>Profile</title>

<link
rel="preconnect"
href="https://fonts.googleapis.com"
/>

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin
/>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet"
/>

<link
rel="stylesheet"
href="style.css"
/>

</head>

<body>

<!-- BG -->

<div class="bg"></div>

<div class="bg-lights">

    <div class="light light1"></div>
    <div class="light light2"></div>
    <div class="light light3"></div>

</div>

<canvas id="particles"></canvas>

<!-- OVERLAY -->

<div id="overlay">

    <div class="noise"></div>

    <div class="intro">

        <div class="intro-glow"></div>

        <div class="enter-box">

            <span>
                click to enter
            </span>

        </div>

        <div class="visualizer">

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>

    </div>

</div>

<!-- CURSOR -->

<div id="cursor-glow"></div>
<div id="mouse-light"></div>

<!-- MAIN -->

<main id="app">

    <div class="card">

        <!-- DISCORD BANNER -->

        <div class="banner"></div>

        <!-- AVATAR -->

        <div class="avatar-wrap">

            <img
            class="avatar-decoration"
            src=""
            alt=""
            />

            <div class="status dnd"></div>

            <img
            class="avatar"
            src=""
            alt=""
            />

        </div>

        <!-- BADGES -->

        <div class="badges"></div>

        <!-- USER -->

        <h1 class="username">
            Loading...
        </h1>

        <p class="bio">
            loading profile...
        </p>

        <!-- MUSIC -->

        <div class="music-player">

            <div class="music-cover">
                ♪
            </div>

            <div class="music-info">

                <div class="music-title">
                    Not Playing
                </div>

                <div class="music-artist">
                    Spotify Idle
                </div>

            </div>

        </div>

        <!-- SOCIAL -->

        <div class="socials">

            <a
            target="_blank"
            href="https://discord.com">

            discord

            </a>

            <a
            target="_blank"
            href="https://facebook.com">

            facebook

            </a>

            <a
            target="_blank"
            href="#">

            website

            </a>

        </div>

    </div>

</main>

<!-- RIPPLE -->

<div id="ripple-container"></div>

<script src="script.js"></script>

</body>
</html>
