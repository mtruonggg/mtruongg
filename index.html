<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Discord Quests Auto</title>

<meta name="theme-color" content="#EB459E">

<style>
:root{
--blurple:#5865F2;
--blurple-dark:#4752C4;
--blurple-glow:rgba(88,101,242,.5);
--fuchsia:#EB459E;
--fuchsia-glow:rgba(235,69,158,.4);
--bg-primary:#0E0F13;
--bg-tertiary:#25262C;
--text-muted:#6D7080;
}

/* RESET */
*{margin:0;padding:0;box-sizing:border-box}
html,body{
background:var(--bg-primary);
width:100%;height:100%;
overflow:hidden;
font-family:system-ui;
}

/* BACKGROUND (GIỮ NGUYÊN) */
.bg-layer,.grid-overlay,.noise,#particleCanvas,.orb{position:fixed;inset:0;pointer-events:none}

/* LOADER */
#loader{
position:fixed;inset:0;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:25px;
}

/* LOGO WRAP */
.logo-wrapper{
position:relative;
width:120px;height:120px;
display:flex;
align-items:center;
justify-content:center;
}

/* ❌ XÓA NỀN VUÔNG DISCORD */
.logo-inner{
width:120px;height:120px;
background:transparent!important;
box-shadow:none!important;
display:flex;
align-items:center;
justify-content:center;
border-radius:0;
}

/* LOGO */
.custom-logo{
width:80px;
height:80px;
object-fit:contain;
border-radius:0;
animation:float 3s ease-in-out infinite;
filter:drop-shadow(0 0 10px rgba(255,255,255,.15));
}

@keyframes float{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-5px)}
}

/* TITLE */
.title{color:#fff;font-size:22px;font-weight:700}
.subtitle{color:var(--text-muted);font-size:11px}
</style>
</head>

<body>

<div id="loader">

    <div class="logo-wrapper">
        <div class="logo-inner">
            <img class="custom-logo" src="https://files.catbox.moe/z2ogmi.jpg">
        </div>
    </div>

    <div class="title">Auto Quest</div>
    <div class="subtitle">JINE BOT SYSTEM</div>

</div>

</body>
</html>
