<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Countdown 2026</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:system-ui;
  background:#000;
  color:#fff;
}

/* Canvas nền */
canvas{
  position:fixed;
  inset:0;
  z-index:-1;
}

/* Fade khi chuyển */
.fade-out{
  animation:fadeOut 1s forwards;
}

@keyframes fadeOut{
  to{opacity:0;transform:scale(1.1)}
}

/* Wrap */
.wrap{
  text-align:center;
  transition:.4s;
}

.wrap.final{
  animation:zoomPulse .5s infinite alternate;
}

@keyframes zoomPulse{
  from{transform:scale(1)}
  to{transform:scale(1.05)}
}

/* Clock */
.clock{
  display:flex;
  align-items:center;
  gap:14px;
}

/* Box */
.box{
  width:90px;
  height:80px;
  border-radius:18px;
  backdrop-filter:blur(12px);
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.15);
  box-shadow:
    0 6px 20px rgba(0,0,0,0.6),
    inset 0 0 15px rgba(255,215,0,0.2);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:42px;
  font-weight:800;
}

/* Gold */
.gold{
  background:linear-gradient(180deg,#fff6c7,#ffd700,#b8860b);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 0 8px rgba(255,215,0,.6);
}

/* Colon */
.colon{
  font-size:40px;
  color:#ffd700;
  animation:blink 1.2s infinite;
}

@keyframes blink{
  0%,50%,100%{opacity:1}
  25%,75%{opacity:.3}
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="wrap" id="wrap">
  <div class="clock">
    <div class="box gold" id="h">00</div>
    <div class="colon">:</div>
    <div class="box gold" id="m">00</div>
    <div class="colon">:</div>
    <div class="box gold" id="s">00</div>
  </div>
</div>

<script>
const TARGET = new Date(2026,1,17,0,0,0).getTime();
const REDIRECT_URL = "./fireworks.html";

const wrap = document.getElementById("wrap");
const hEl = document.getElementById("h");
const mEl = document.getElementById("m");
const sEl = document.getElementById("s");

let last = -1;
let redirected = false;

/* ===== AUDIO HỒI HỘP ===== */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function tickSound(speed=1){
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "sine";
  osc.frequency.value = 120 * speed;
  gain.gain.value = 0.08;

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime + 0.08);
}

function boomSound(){
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type="sawtooth";
  osc.frequency.setValueAtTime(80,audioCtx.currentTime);
  gain.gain.setValueAtTime(0.4,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+1);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime+1);
}

window.addEventListener("pointerdown",()=>{
  audioCtx.resume();
},{once:true});

/* ===== LOOP ===== */
function loop(){
  const now = Date.now();
  const remain = Math.max(0, Math.floor((TARGET-now)/1000));

  if(remain !== last){
    last = remain;

    const h = Math.floor(remain%86400/3600);
    const m = Math.floor(remain%3600/60);
    const s = remain%60;

    hEl.textContent = String(h).padStart(2,"0");
    mEl.textContent = String(m).padStart(2,"0");
    sEl.textContent = String(s).padStart(2,"0");

    if(remain <= 10 && remain > 0){
      wrap.classList.add("final");
      tickSound(2);
    } else {
      wrap.classList.remove("final");
      tickSound(1);
    }

    /* HẾT GIỜ */
    if(remain === 0 && !redirected){
      redirected = true;
      boomSound();
      document.body.classList.add("fade-out");

      setTimeout(()=>{
        window.location.href = REDIRECT_URL;
      },1000);
    }
  }

  requestAnimationFrame(loop);
}
loop();

/* ===== BACKGROUND VIP ===== */
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
resize();
addEventListener("resize",resize);

let angle=0;

function draw(){
  ctx.fillStyle="#050b1a";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.strokeStyle="rgba(255,215,0,0.08)";
  ctx.lineWidth=2;

  for(let i=0;i<6;i++){
    ctx.beginPath();
    ctx.arc(
      canvas.width/2,
      canvas.height/2,
      150 + i*60,
      angle,
      angle + Math.PI*1.2
    );
    ctx.stroke();
  }

  angle+=0.002;
  requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
