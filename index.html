<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>JINE PROFILE</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />

  <link
    rel="stylesheet"
    href="./style.css"
  />

</head>

<body>

  <!-- LOADING -->
  <div id="loading-screen">

    <div class="loader">

      <div class="spinner"></div>

      <h1>Loading</h1>

      <p>
        Preparing Experience...
      </p>

    </div>

  </div>

  <!-- CLICK ENTER -->
  <div id="enter-screen">

    <div class="enter-box glass">

      <h1>Welcome</h1>

      <p>
        click to enter experience
      </p>

      <button id="enter-btn">
        Click To Enter
      </button>

    </div>

  </div>

  <!-- BACKGROUND -->
  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>

  <!-- PROFILE -->
  <div class="container">

    <div class="profile-card glass">

      <!-- BANNER -->
      <div class="banner">

        <img
          src="./assets/banner.jpg"
          alt="banner"
        />

      </div>

      <!-- CONTENT -->
      <div class="profile-content">

        <!-- AVATAR -->
        <img
          id="avatar"
          class="avatar"
          src="./assets/avatar.jpg"
          alt="avatar"
        />

        <!-- INFO -->
        <div class="info">

          <div class="username-row">

            <h1 id="username">
              Loading...
            </h1>

            <span
              id="status-dot"
              class="status-dot">
            </span>

          </div>

          <p id="pronouns">
            he/him
          </p>

          <p id="bio">
            My name mtruong 
          </p>

        </div>

<div class="socials">

  <a
    id="facebook-link"
    class="glass social-btn"
    target="_blank"
  >
    <i class="fab fa-facebook"></i>
  </a>

  <a
    id="discord-link"
    class="glass social-btn"
    target="_blank"
  >
    <i class="fab fa-discord"></i>
  </a>

  <a
    id="website-link"
    class="glass social-btn"
    target="_blank"
  >
    <i class="fas fa-globe"></i>
  </a>

</div>

        <!-- DISCORD CARD -->
        <div
          id="discord-card"
          class="glass discord-card"
        >

          <div class="discord-header">

            <div class="status-wrap">

              <div
                id="discord-status"
                class="online-dot">
              </div>

              <span
                id="discord-text"
              >
                Loading...
              </span>

            </div>

          </div>

          <div id="activity-box">

            <p class="playing">
              ACTIVITY
            </p>

            <h3 id="activity-name">
              No activity
            </h3>

            <p id="activity-details"></p>

            <p id="activity-state"></p>

          </div>

        </div>

        <!-- SPOTIFY REALTIME -->
        <div
          id="spotify-card"
          class="glass spotify-card hidden"
        >

          <img
            id="spotify-cover"
            src=""
            alt=""
          />

          <div class="spotify-info">

            <p class="spotify-tag">
              Listening to Spotify
            </p>

            <h3 id="spotify-song"></h3>

            <p id="spotify-artist"></p>

            <small id="spotify-album">
            </small>

          </div>

        </div>

        <!-- SPOTIFY PLAYLIST -->
        <div class="spotify-embed glass">

          <iframe
            style="border-radius:20px"
            src="https://open.spotify.com/embed/playlist/6UatyjkgASKXHfSCU5Lwby?utm_source=generator&theme=0"
            width="100%"
            height="152"
            frameBorder="0"
            allowfullscreen=""
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
            loading="lazy">
          </iframe>

        </div>

      </div>

    </div>

  </div>

  <!-- CONFIG -->
  <script src="./config.js"></script>

  <!-- MAIN SCRIPT -->
  <script src="./script.js"></script>

</body>

</html>
