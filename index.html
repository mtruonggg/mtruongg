<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ultimate Countdown</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#050510;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:system-ui;
  overflow:hidden;
  color:#fff;
}

/* ===== BACKGROUND GOLD GLOW ===== */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:radial-gradient(circle at center,
    rgba(255,215,0,.15),
    transparent 70%);
  animation:bgPulse 4s infinite alternate;
}
@keyframes bgPulse{
  from{opacity:.3}
  to{opacity:.7}
}

/* ===== WRAP ===== */
.wrap{
  text-align:center;
  z-index:2;
}

.title{
  font-size:28px;
  letter-spacing:6px;
  margin-bottom:40px;
  font-weight:800;
  background:linear-gradient(#fff6c7,#ffd700,#b8860b);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 0 15px rgba(255,215,0,.7);
}

/* ===== CLOCK ===== */
.clock{
  display:flex;
  gap:18px;
  justify-content:center;
  perspective:1000px;
}

/* ===== SPLIT FLAP BOX ===== */
.flap{
  position:relative;
  width:110px;
  height:120px;
  perspective:1000px;
}

.card{
  position:absolute;
  width:100%;
  height:100%;
  background:linear-gradient(#111,#000);
  border-radius:16px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:60px;
  font-weight:900;
  color:#ffd700;
  box-shadow:
    0 15px 35px rgba(0,0,0,.7),
    inset 0 0 25px rgba(255,215,0,.15);
  text-shadow:
    0 4px 0 #b8860b,
    0 8px 15px rgba(0,0,0,.6);
  backface-visibility:hidden;
  transition:transform .6s cubic-bezier(.22,1,.36,1);
}

.top{
  clip-path:inset(0 0 50% 0);
  border-bottom:1px solid #333;
}

.bottom{
  clip-path:inset(50% 0 0 0);
}

/* ===== FLIP ANIMATION ===== */
.flip .top{
  transform:rotateX(-90deg);
}
.flip .bottom{
  transform:rotateX(0deg);
}

/* ===== PARTICLES ===== */
.particle{
  position:absolute;
  width:6px;
  height:6px;
  background:gold;
  border-radius:50%;
  pointer-events:none;
  animation:particle 1s forwards;
}
@keyframes particle{
  to{
    transform:translate(var(--x),var(--y)) scale(0);
    opacity:0;
  }
}

/* ===== FADE OUT ===== */
.fade-out{
  animation:fadeOut 1s forwards;
}
@keyframes fadeOut{
  to{opacity:0}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="title">COUNTDOWN</div>

  <div class="clock">
    <div class="flap" id="h"></div>
    <div class="flap" id="m"></div>
    <div class="flap" id="s"></div>
  </div>
</div>

<script>
const TARGET = new Date(2026,1,17,0,0,0).getTime();
const REDIRECT_URL = "./fireworks.html";

/* ===== CREATE FLAP ===== */
function createFlap(el){
  el.innerHTML=`
    <div class="card top">00</div>
    <div class="card bottom">00</div>
  `;
}
createFlap(h);
createFlap(m);
createFlap(s);

/* ===== UPDATE FLAP ===== */
function updateFlap(el,newVal){
  const top=el.querySelector(".top");
  const bottom=el.querySelector(".bottom");

  if(top.textContent===newVal) return;

  createParticles(el);

  el.classList.add("flip");

  setTimeout(()=>{
    top.textContent=newVal;
    bottom.textContent=newVal;
    el.classList.remove("flip");
  },300);
}

/* ===== PARTICLE EFFECT ===== */
function createParticles(el){
  const rect=el.getBoundingClientRect();
  for(let i=0;i<20;i++){
    const p=document.createElement("div");
    p.className="particle";
    p.style.left=rect.width/2+"px";
    p.style.top=rect.height/2+"px";
    p.style.setProperty("--x",(Math.random()*200-100)+"px");
    p.style.setProperty("--y",(Math.random()*-200)+"px");
    el.appendChild(p);
    setTimeout(()=>p.remove(),1000);
  }
}

/* ===== LOOP ===== */
let last=-1;
let finished=false;

function loop(){
  const now=Date.now();
  const remain=Math.max(0,Math.floor((TARGET-now)/1000));

  if(remain!==last){
    last=remain;

    const hh=String(Math.floor(remain%86400/3600)).padStart(2,"0");
    const mm=String(Math.floor(remain%3600/60)).padStart(2,"0");
    const ss=String(remain%60).padStart(2,"0");

    updateFlap(h,hh);
    updateFlap(m,mm);
    updateFlap(s,ss);

    if(remain===0 && !finished){
      finished=true;
      setTimeout(()=>{
        document.body.classList.add("fade-out");
        setTimeout(()=>{
          window.location.href=REDIRECT_URL;
        },1000);
      },2000);
    }
  }

  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
